<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Intelligence | Seeker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Mystical Theme Palette - Gold on Deep Purple */
            --bg-primary: #0a0612;
            --bg-secondary: #1a0a2e;
            --bg-tertiary: #2d1b4e;
            --bg-card: rgba(26, 10, 46, 0.8);
            --ethereal-overlay: rgba(255, 255, 255, 0.1);

            --text-primary: #f4e4a6;
            --text-secondary: #d4af37;
            --text-muted: rgba(244, 228, 166, 0.6);

            --accent: #d4af37;
            --accent-dim: #b8962f;
            --accent-glow: rgba(212, 175, 55, 0.6);
            --accent-bright: #f4e4a6;

            --green: #5fa777;
            --red: #c45c52;
            --orange: #d4943a;

            --border: rgba(212, 175, 55, 0.3);
            --border-hover: rgba(212, 175, 55, 0.6);

            /* Fonts */
            --font-display: 'Cinzel', Georgia, serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --font-body: 'Cormorant Garamond', Georgia, serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0612 70%);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Starfield layer */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #d4af37, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 90px 40px, #f4e4a6, transparent),
                radial-gradient(2px 2px at 160px 120px, #d4af37, transparent),
                radial-gradient(1px 1px at 230px 80px, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 300px 150px, #f4e4a6, transparent),
                radial-gradient(1px 1px at 370px 50px, #d4af37, transparent),
                radial-gradient(2px 2px at 450px 180px, rgba(255,255,255,0.5), transparent);
            background-size: 500px 200px;
            animation: twinkle 8s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Sacred geometry - rotating */
        .sacred-geometry {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            opacity: 0.12;
            z-index: 0;
            animation: rotate 120s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Floating particles container - behind content */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            color: var(--accent);
            opacity: 0;
            animation: float-up linear forwards;
            font-size: 0.8rem;
        }

        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Utilities */
        .mono {
            font-family: var(--font-mono);
        }

        .text-accent {
            color: var(--accent);
        }

        .text-green {
            color: var(--green);
        }

        .text-red {
            color: var(--red);
        }

        .text-muted {
            color: var(--text-muted);
        }

        .uppercase {
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* SVG triangle with eye */
        .logo-mark svg {
            width: 32px;
            height: 32px;
        }

        /* Animated eye in pyramid */
        .eye-iris {
            animation: look 4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes look {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-1.5px); }
            75% { transform: translateX(1.5px); }
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .logo-subtitle {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-style: italic;
            color: var(--text-muted);
            margin-left: 0.5rem;
            letter-spacing: 0.05em;
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.4rem 1rem;
            background: var(--accent-glow);
            border: 1px solid var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.05em;
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 2rem;
        }

        .grid-cols-12 {
            grid-template-columns: repeat(12, 1fr);
        }

        .col-span-12 {
            grid-column: span 12;
        }

        .col-span-8 {
            grid-column: span 8;
        }

        .col-span-4 {
            grid-column: span 4;
        }

        /* Cards */
        .card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(45, 27, 78, 0.6) 100%);
            border: 1px solid var(--accent);
            padding: 2rem;
            border-radius: 4px;
            transition: all 0.4s ease;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .card::before {
            content: '◇';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent);
            font-size: 0.8rem;
            background: var(--bg-primary);
            padding: 0 0.5rem;
        }

        .card:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(45, 27, 78, 0.8) 100%);
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            font-weight: 500;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title .text-accent {
            font-size: 0.6rem;
        }

        /* Market Cards */
        .market-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .market-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 2px;
            text-align: center;
        }

        .market-card .symbol {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            letter-spacing: 0.1em;
        }

        .market-card .price {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .market-card .stats {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        /* Outlook */
        .outlook-content {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text-secondary);
            font-family: var(--font-body);
        }

        .outlook-content strong {
            color: var(--accent-bright);
            font-weight: 500;
        }

        /* Sentiment */
        .sentiment-meter {
            height: 3px;
            background: var(--bg-tertiary);
            border-radius: 0;
            margin: 1rem 0;
            overflow: hidden;
            position: relative;
        }

        .sentiment-meter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, var(--red) 0%, var(--orange) 50%, var(--green) 100%);
            opacity: 0.2;
        }

        .sentiment-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent-bright));
            border-radius: 0;
            transition: width 1s ease;
            position: relative;
            z-index: 1;
        }

        /* Loading/Error */
        .state-msg {
            text-align: center;
            padding: 4rem;
            font-family: var(--font-display);
            font-style: italic;
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .state-msg::before {
            content: '☼';
            display: block;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-cols-12 {
                grid-template-columns: 1fr;
            }

            .col-span-12,
            .col-span-8,
            .col-span-4 {
                grid-column: span 1;
            }

            .market-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Sacred Geometry - Metatron's Cube -->
    <svg class="sacred-geometry" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer circle -->
        <circle cx="100" cy="100" r="80" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <!-- Inner circle -->
        <circle cx="100" cy="100" r="40" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <!-- Hexagon nodes -->
        <circle cx="100" cy="20" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <circle cx="169" cy="60" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <circle cx="169" cy="140" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <circle cx="100" cy="180" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <circle cx="31" cy="140" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <circle cx="31" cy="60" r="25" stroke="#d4af37" stroke-width="0.5" fill="none"/>
        <!-- Connecting lines -->
        <line x1="100" y1="20" x2="169" y2="60" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="169" y1="60" x2="169" y2="140" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="169" y1="140" x2="100" y2="180" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="100" y1="180" x2="31" y2="140" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="31" y1="140" x2="31" y2="60" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="31" y1="60" x2="100" y2="20" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="100" y1="20" x2="100" y2="180" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="31" y1="60" x2="169" y2="140" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
        <line x1="169" y1="60" x2="31" y2="140" stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>
    </svg>

    <div class="container">
        <header>
            <a href="site/index.html" class="logo">
                <div class="logo-mark">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#4a90d9"/>
                                <stop offset="50%" stop-color="#1a4a7a"/>
                                <stop offset="100%" stop-color="#0a1a2a"/>
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <!-- Triangle -->
                        <path d="M20 4 L36 34 L4 34 Z" stroke="#d4af37" stroke-width="1.5" fill="rgba(10,6,18,0.8)" filter="url(#glow)"/>
                        <!-- Eye outer -->
                        <ellipse cx="20" cy="21" rx="7" ry="4" stroke="#d4af37" stroke-width="1" fill="#0a0612"/>
                        <!-- Iris (animated) -->
                        <circle class="eye-iris" cx="20" cy="21" r="3" fill="url(#irisGradient)"/>
                        <!-- Pupil -->
                        <circle class="eye-iris" cx="20" cy="21" r="1.2" fill="#0a0612"/>
                    </svg>
                </div>
                <span class="logo-text">Seeker</span>
                <span class="logo-subtitle">of Hidden Patterns</span>
            </a>
            <div class="status-badge">
                <span style="margin-right: 0.3rem;">✶</span>
                <span id="lastUpdated">Connecting...</span>
            </div>
        </header>

        <div id="loading" class="state-msg">Consulting the Oracle...</div>
        <div id="error" class="state-msg" style="display: none; color: var(--red);">
            The Veil is Closed<br>
            <span style="font-size: 0.8rem; margin-top: 1rem; display: block; font-style: normal;">Ensure you are running a local server</span>
        </div>

        <main id="mainContent" style="display: none;">

            <!-- AI Market Outlook (Top Priority) -->
            <section class="card" style="margin-bottom: 2rem;">
                <div class="card-header">
                    <div class="card-title"><span class="text-accent">◆</span> Market Divination</div>
                    <div id="sentimentBadge"></div>
                </div>
                <div id="outlookContent" class="outlook-content"></div>

                <div class="grid grid-cols-12"
                    style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <div class="col-span-4">
                        <div class="card-title" style="margin-bottom: 1rem; font-size: 0.7rem;">✶ Symbols of Focus</div>
                        <div id="keyTickers" class="flex" style="flex-wrap: wrap; gap: 0.5rem;"></div>
                    </div>
                    <div class="col-span-4">
                        <div class="card-title" style="margin-bottom: 1rem; font-size: 0.7rem;">✶ Emerging Themes</div>
                        <ul id="keyThemes"
                            style="list-style: none; font-size: 0.85rem; font-family: var(--font-body); color: var(--text-secondary); font-style: italic;">
                        </ul>
                    </div>
                    <div class="col-span-4">
                        <div class="card-title" style="margin-bottom: 1rem; font-size: 0.7rem;">✶ Shadows & Risks</div>
                        <ul id="riskFactors"
                            style="list-style: none; font-size: 0.85rem; font-family: var(--font-body); color: var(--text-secondary); font-style: italic;">
                        </ul>
                    </div>
                </div>
            </section>

            <!-- X List Analysis Section -->
            <section class="card" style="margin-bottom: 2rem;">
                <div class="card-header">
                    <div class="card-title"><span class="text-accent">◆</span> Social Signals</div>
                    <span class="mono text-muted" style="font-size: 0.65rem; font-style: italic;">Whispers from the Feeds</span>
                </div>
                <div id="listsContainer" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                    <div class="text-muted">Loading lists...</div>
                </div>
            </section>

            <!-- Sentiment & Other Details (Bottom) -->
            <div class="grid grid-cols-12">
                <!-- Sentiment Analysis -->
                <section class="col-span-8 card">
                    <div class="card-header">
                        <div class="card-title"><span class="text-accent">◆</span> Sentiment Alchemy</div>
                    </div>
                    <div id="sentimentDetails" class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;"></div>
                </section>

                <!-- Regime/IV (from Outlook data) -->
                <section class="col-span-4 card">
                    <div class="card-header">
                        <div class="card-title"><span class="text-accent">◆</span> Market Regime</div>
                    </div>
                    <div id="regimeContent"></div>
                </section>
            </div>

        </main>
    </div>

    <script>
        async function init() {
            try {
                // Fetch all data sources in parallel
                const [outlookRes, marketRes, listsRes] = await Promise.all([
                    fetch('data/outlook.json'),
                    fetch('data/market.json'),
                    fetch('data/lists.json')
                ]);

                if (!outlookRes.ok || !marketRes.ok) throw new Error('Failed to load data');

                const outlookData = await outlookRes.json();
                const marketData = await marketRes.json();
                const listsData = listsRes.ok ? await listsRes.json() : null;

                renderDashboard(outlookData, marketData, listsData);

                // Update timestamp
                const date = new Date(outlookData.timestamp);
                document.getElementById('lastUpdated').textContent = `UPDATED ${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;

                // Check freshness (30 min warning)
                const now = new Date();
                const diffMins = (now - date) / 60000;
                if (diffMins > 30) {
                    const badge = document.getElementById('lastUpdated');
                    badge.style.borderColor = 'var(--orange)';
                    badge.style.color = 'var(--orange)';
                    badge.textContent += ' (STALE)';
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

            } catch (e) {
                console.error(e);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderDashboard(outlook, market, lists) {
            renderOutlook(outlook);
            renderSentiment(outlook.sentiment);
            renderRegime(outlook.regime);
            if (lists) renderLists(lists);
        }

        function renderOutlook(data) {
            const analysis = data.analysis;

            // Badge
            const sentClass = data.sentiment.overall.toLowerCase() === 'bullish' ? 'text-green' : 'text-red';
            document.getElementById('sentimentBadge').innerHTML =
                `<span class="mono uppercase ${sentClass}" style="font-weight: 600;">${data.sentiment.overall} (${data.sentiment.confidence_pct}%)</span>`;

            // Narrative processing
            let narrative = analysis.narrative
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-primary">$1</strong>')
                .replace(/\n/g, '<br>')
                .replace(/📊|⚡|🎯/g, match => `<span style="font-size: 1.2em; margin-right: 0.5rem;">${match}</span>`);

            document.getElementById('outlookContent').innerHTML = narrative;

            // Footer Lists
            document.getElementById('keyTickers').innerHTML = analysis.key_tickers.map(t =>
                `<span class="mono" style="background: var(--accent-glow); color: var(--accent); padding: 3px 10px; border: 1px solid var(--border); font-size: 0.75rem; letter-spacing: 0.05em;">${t}</span>`
            ).join('');

            document.getElementById('keyThemes').innerHTML = analysis.key_themes.map(t => `<li style="margin-bottom: 0.4rem;"><span style="color: var(--accent); margin-right: 0.5rem;">◇</span>${t}</li>`).join('');
            document.getElementById('riskFactors').innerHTML = analysis.risk_factors.map(t => `<li style="margin-bottom: 0.4rem;"><span style="color: var(--red); margin-right: 0.5rem;">◇</span>${t}</li>`).join('');
        }



        function renderSentiment(sentiment) {
            const container = document.getElementById('sentimentDetails');
            const s = sentiment.sources;

            const renderSource = (label, icon, obj) => {
                return `
                    <div style="background: var(--bg-tertiary); padding: 1rem; border: 1px solid var(--border);">
                        <div class="flex justify-between items-center" style="margin-bottom: 0.5rem;">
                            <span style="font-size: 0.7rem; color: var(--accent); letter-spacing: 0.1em;">${icon} ${label}</span>
                            <span class="mono text-muted" style="font-size: 0.65rem;">${obj.total} readings</span>
                        </div>
                        <div class="sentiment-meter">
                            <div class="sentiment-fill" style="width: ${obj.pct}%"></div>
                        </div>
                        <div class="flex justify-between" style="font-size: 0.65rem;">
                            <span style="color: var(--green);">▲ ${obj.bullish}</span>
                            <span style="color: var(--red);">▼ ${obj.bearish}</span>
                        </div>
                    </div>
                `;
            };

            container.innerHTML = `
                ${renderSource('Social', '✶', s.social)}
                ${renderSource('News', '◆', s.news)}
                ${renderSource('Video', '☼', s.video)}
                ${renderSource('Other', '◇', s.chat)}
            `;
        }

        function renderRegime(regime) {
            if (!regime) return;
            const regimeIcon = regime.label === 'BULLISH' ? '☼' : regime.label === 'BEARISH' ? '☾' : '◇';
            const regimeColor = regime.label === 'BULLISH' ? 'var(--green)' : regime.label === 'BEARISH' ? 'var(--red)' : 'var(--accent)';
            document.getElementById('regimeContent').innerHTML = `
                <div style="text-align: center; padding: 1rem 0;">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem; color: ${regimeColor};">${regimeIcon}</div>
                    <div style="font-family: var(--font-display); font-size: 1.3rem; color: ${regimeColor}; letter-spacing: 0.1em; margin-bottom: 0.75rem;">${regime.label}</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); font-style: italic; line-height: 1.6;">${regime.summary}</div>
                    <div style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted);">
                        <span style="margin-right: 1rem;">VIX ${regime.vix}</span>
                        <span>P/C ${regime.pc_ratio}</span>
                    </div>
                </div>
            `;
        }

        function renderLists(listsData) {
            if (!listsData || !listsData.lists) return;

            const container = document.getElementById('listsContainer');
            if (!container) return;

            const lists = listsData.lists.filter(l => l.tickers.length > 0 || l.themes.length > 0);

            if (lists.length === 0) {
                container.innerHTML = '<div class="text-muted">No list data available. Run the scraper to generate signals.</div>';
                return;
            }

            container.innerHTML = lists.map(list => {
                // Build tickers section
                const tickersHtml = list.tickers.slice(0, 5).map(t => {
                    const sentColor = t.sentiment === 'bullish' ? 'var(--green)' :
                                     t.sentiment === 'bearish' ? 'var(--red)' : 'var(--text-muted)';
                    const sentIcon = t.sentiment === 'bullish' ? '▲' :
                                    t.sentiment === 'bearish' ? '▼' : '◇';
                    return `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border);">
                            <div>
                                <span class="mono" style="font-weight: 500; color: var(--accent-bright); letter-spacing: 0.05em;">${t.symbol}</span>
                                <span class="mono text-muted" style="font-size: 0.6rem; margin-left: 0.4rem;">×${t.mention_count}</span>
                            </div>
                            <span style="font-size: 0.65rem; color: ${sentColor};">${sentIcon}</span>
                        </div>
                    `;
                }).join('');

                // Build themes section (top 2)
                const themesHtml = list.themes.slice(0, 2).map(t => {
                    const sentColor = t.sentiment === 'bullish' ? 'var(--green)' :
                                     t.sentiment === 'bearish' ? 'var(--red)' : 'var(--accent-dim)';
                    return `
                        <div style="font-size: 0.7rem; color: var(--text-secondary); padding: 0.4rem 0; border-left: 2px solid ${sentColor}; padding-left: 0.6rem; margin-bottom: 0.3rem; font-style: italic;">
                            ${t.theme.length > 55 ? t.theme.substring(0, 55) + '...' : t.theme}
                        </div>
                    `;
                }).join('');

                return `
                    <div style="background: var(--bg-tertiary); padding: 1.25rem; border: 1px solid var(--border); position: relative;">
                        <div style="position: absolute; top: -6px; left: 1rem; background: var(--bg-primary); padding: 0 0.5rem; font-size: 0.65rem; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase;">
                            ${list.list_name}
                        </div>
                        <div style="margin-top: 0.5rem;">
                            ${tickersHtml || '<div class="text-muted" style="font-size: 0.75rem; font-style: italic;">Awaiting signals...</div>'}
                        </div>
                        ${themesHtml ? `<div style="margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid var(--border);">${themesHtml}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initialize floating particles - continuous generation
        function initParticles() {
            const container = document.getElementById('particles');
            const symbols = ['✦', '◈', '◊', '✶'];

            function createParticle() {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.bottom = '-20px';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 7000);
            }

            // Create particles every 800ms
            setInterval(createParticle, 800);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initParticles();
            init();
        });
    </script>
</body>

</html>
